              issue_number: context.issue.number
            });

            for (const comment of comments) {
              if (comment.user.login === 'claude[bot]' && 
                  comment.body.includes('PR Review') &&
                  !comment.body.startsWith('<details>')) {
                
                // Extract the review content
                const reviewContent = comment.body;
                
                // Create collapsed version
                const collapsedBody = `
            ✅ Focus on **improving the codebase holistically**, not enforcing absolute rules.  
            ✅ The best reviews balance **technical correctness**, **developer empathy**, and **contextual trade-offs**.
